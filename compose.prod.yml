# ============================================================
# Vaxen API — Production
# ============================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#
# Differences from dev:
#   - No exposed DB/Redis ports (internal only)
#   - No pgAdmin
#   - Resource limits
#   - Health checks on API
#   - Restart always
#   - Expects .env.prod or environment variables from orchestrator
# ============================================================

name: vaxen-api-prod

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    networks:
      - vaxen_network

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vaxen}
    # No exposed ports — only reachable from the API
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - vaxen_network

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # No exposed ports
    volumes:
      - redis_data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - vaxen_network

volumes:
  postgres_data:
  redis_data:

networks:
  vaxen_network:
    driver: bridge
